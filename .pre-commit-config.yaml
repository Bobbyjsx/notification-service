repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-unit-tests
        name: pytest (unit tests)
        entry: ./.venv/bin/pytest tests/unit/test_logger_middleware.py tests/unit/test_security.py tests/unit/test_state_machine.py tests/unit/test_template_renderer.py
        language: system
        pass_filenames: false
        always_run: true
